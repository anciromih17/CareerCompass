name: CI/CD
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend_testing:
    name: Backend build and unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm run build --prefix backend
      - run: npm test --prefix backend -- --runInBand

  functional_testing:
    name: Production build and functional tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix backend
          npm ci --prefix frontend
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build and test production application with Docker MongoDB
        run: npm run test:e2e
      - name: Save reports and service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-test-results
          retention-days: 14
          include-hidden-files: true
          path: |
            playwright-report/
            test-results/
            e2e/.runtime/*.log
      - name: Stop test database
        if: always()
        run: docker compose stop mongodb

  sonarcloud:
    name: SonarCloud (when configured for this repository)
    if: ${{ vars.SONAR_ORGANIZATION != '' && vars.SONAR_PROJECT_KEY != '' }}
    needs: [backend_testing, functional_testing]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
