name: CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_backend:
    name: Build backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install backend dependencies and build
        working-directory: backend
        run: |
          npm ci
          npm run build

  build_frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install frontend dependencies and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  backend_testing:
    name: Backend unit testing
    runs-on: ubuntu-latest
    needs: build_backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend unit tests
        working-directory: backend
        run: npm run test

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: [build_frontend, backend_testing]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=mtoplak
            -Dsonar.projectKey=mtoplak_CareerCompass
            -Dsonar.qualitygate.wait=false

  functional_testing:
    name: Functional tests (Playwright)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install test tools and application dependencies
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend
      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Run five functional test cases in isolated services
        run: npm run test:e2e
      - name: Save reports and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-test-results
          retention-days: 14
          include-hidden-files: true
          path: |
            playwright-report/
            test-results/
            e2e/.runtime/*.log
